[tox]
env_list =
    lint
    mypy
    clean
    py{39,310,311,312,313}
    covcombine
    covreport

[testenv]
package = wheel
wheel_build_env = build_wheel
dependency_groups = test
commands = coverage run -m pytest -v {posargs}

depends =
    py{39,310,311,312,313}: clean
    covcombine: py{39,310,311,312,313}
    covreport: covcombine

[testenv:clean]
dependency_groups = coverage
skip_install = true
commands = coverage erase

[testenv:covcombine]
dependency_groups = coverage
skip_install = true
commands = coverage combine

[testenv:covreport]
dependency_groups = coverage
skip_install = true
commands_pre = coverage html --fail-under=0
commands = coverage report


[testenv:docs]
basepython = python3.14
dependency_groups = docs
allowlist_externals = rm
changedir = docs/
# clean the build dir before rebuilding
commands_pre = rm -rf _build/
commands = sphinx-build -j auto -d _build/doctrees -b html -W . _build/html {posargs}


[testenv:lint]
base_python = 3.12
deps = pre-commit
skip_install = true
commands = pre-commit run -a


[testenv:mypy]
dependency_groups = mypy
commands = mypy src/
